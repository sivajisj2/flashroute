limit_req_zone $binary_remote_addr zone=api:10m rate=3r/s;
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
        limit_req zone=api burst=15 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_pass http://api:8080;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
    }
    location / { try_files $uri $uri/ /index.html; }
}
