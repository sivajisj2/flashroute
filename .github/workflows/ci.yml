name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with: {version: v1.4.4}
      - run: forge fmt --check && forge test -vv && forge snapshot
        working-directory: contracts
      - uses: actions/upload-artifact@v4
        with:
          name: gas-snapshot
          path: contracts/.gas-snapshot
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {components: rustfmt, clippy}
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: backend}
      - run: cargo fmt --check && cargo clippy --locked --all-targets -- -D warnings && cargo test --locked
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci && npm test && npm run build
        working-directory: frontend
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/up.sh
      - run: ./scripts/smoke.sh
      - if: always()
        run: docker compose logs --no-color > integration.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: integration-logs, path: integration.log}
      - if: always()
        run: docker compose down
